name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: typecheck · lint · format · test · e2e · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (oxlint, JSON)
        # oxlint exits non-zero if any diagnostics are emitted, so this gates
        # on "zero diagnostics" per §18.10 item 2.
        run: pnpm lint:quick

      - name: Format check
        run: pnpm format:check

      - name: Unit + integration tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build
